perform_simulation: True

grid:
  unique_network_name: "spherical_20_42_4"
  rotation_algorithm: "hypercube"
  rotation_random_seed: 1
  N_rotations: 20
  periodic_in: [False, False]
  translation_algorithm: "spherical"
  translation_subgrids_A: [42, [3, 6, 4]]

pseudotrajectory:
  molecule_1: "benzene"
  molecule_2: "benzene"
  structure_ending: "gro"
  trajectory_ending: "xtc"

plotting:
  upper_E_limit: 0

energy:
  energy_program: ORCA

orca:
  CHUNK_SIZE : 80
  functional: "PBE0"
  basis_set: "def2-TZVP"
  solvent: None
  dispersion_correction: "D3"
  num_scf: None
  num_cores: 4
  ram_per_core: 300

analysis:
  energy_program: GROMACS
  length_shortened_trajectory_ns: 10
  energy_types: ["LJ (SR)", "Coulomb (SR)"]
  upper_E_limit: 0
  analyse_first_N_frames: None
  zoom_level: 0
  view_index: [ 1 , 2 , 4, 5, 6, 7, 8]

msm:
  tolerance: 0
  taus: [1, 2, 3, 5, 10, 20, 30, 50, 100, 200, 300, 500, 1000]

sqra:
  # rate matrix reduction
  capping_factor: None
  cutting_factor: "auto"
  tolerance_rate_matrix_row_sum: 1e-8
  # eigendecomposition
  tolerance_eigendecomposition: 0
  sigma: 0

eigenvectors:
  num_interesting_timescales: 4
  num_interesting_eigenvectors: 4
  num_extremes_to_plot: "auto"