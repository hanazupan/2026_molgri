grid:
  unique_network_name: "auto_80"
  rotation_algorithm: "hypercube"
  rotation_random_seed: 1
  N_rotations: 80
  translation_algorithm: "cartesian"
  periodic_in: [True, True, False]
  translation_subgrids_A: [ [None, None, 5], [ None, None, 5], [1.5, 4, 5] ]

pseudotrajectory:
  molecule_1: "graphene"
  molecule_2: "xylene"
  structure_ending: "gro"
  trajectory_ending: "xtc"

analysis:
  energy_program: GROMACS
  zoom_level: [8]
  view_index: [1, 4]
  length_shortened_trajectory_ns: 10
  upper_E_limit: 0
  energy_types: ["Coul-SR:MOL1-MOL2", "LJ-SR:MOL1-MOL2"]
  analyse_first_N_frames: None

msm:
  num_interesting_timescales: 4
  num_interesting_eigenvectors: 12
  num_extremes_to_plot: "auto"
  capping_factor: None
  cutting_factor: 500 # allow both auto and setting a number
  sigma_sqra: 0
  taus: [1, 2, 3, 5, 10, 20, 30, 50, 100, 200, 300, 500, 1000]