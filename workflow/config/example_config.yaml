perform_simulation: True

grid:
  unique_network_name: "auto_20"
  rotation_algorithm: "hypercube"
  rotation_random_seed: 1
  N_rotations: 30
  translation_algorithm: "cartesian"
  periodic_in: [True, True, False]
  translation_subgrids_A: [ [None, None, 15], [ None, None, 15], [1.5, 4, 20] ]

pseudotrajectory:
  molecule_1: "graphene"
  molecule_2: "xylene"
  structure_ending: "gro"
  trajectory_ending: "xtc"

energy:
  energy_program: GROMACS


plotting:
  upper_E_limit: 0
  analyse_first_N_frames: None

msm:
  num_interesting_timescales: 4
  num_interesting_eigenvectors: 5
  num_extremes_to_plot: 5