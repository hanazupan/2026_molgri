grid:
  unique_network_name: "auto_200"
  rotation_algorithm: "hypercube"
  rotation_random_seed: 1
  N_rotations: 200
  translation_algorithm: "cartesian"
  periodic_in: [False, False, False]
  translation_subgrids_A: [ [0, 0.1, 1], [ 0, 0.1, 1], [5.3, 5.4, 1] ]

pseudotrajectory:
  molecule_1: "benzene"
  molecule_2: "benzene"
  structure_ending: "gro"
  trajectory_ending: "xtc"

analysis:
  energy_program: GROMACS
  length_shortened_trajectory_ns: 10
  energy_types: ["Potential"]
  upper_E_limit: 0
  analyse_first_N_frames: None


sqra:
  cutting_factor: 1e80
  tolerance_rate_matrix_row_sum: 1e-8

eigenvectors:
  num_interesting_timescales: 4
  num_interesting_eigenvectors: 4
  num_extremes_to_plot: "auto"