grid:
  unique_network_name: "60_60_60"
  rotation_algorithm: "hypercube"
  rotation_random_seed: 1
  N_rotations: 1
  translation_algorithm: "cartesian"
  periodic_in: [False, False, False]
  translation_subgrids_A: [ [-20, 20, 60], [-20, 20, 60], [-20, 20, 60] ]

pseudotrajectory:
  molecule_1: "MOF_num"
  molecule_2: "AR"
  structure_ending: "xyz"
  trajectory_ending: "xyz"

analysis:
  energy_program: "ORCA"
  view_index: [ 2 ]
  length_shortened_trajectory_ns: 10
  energy_types: ["LJ (SR)", "Coulomb (SR)"]
  upper_E_limit: 0
  analyse_first_N_frames: None
  plot_m1_as: "Licorice"
  plot_m2_as: "VDW"
  parts_to_perform: ["plot_lowest_energies", "sqra"]#, "make_pseudotrajectory_lammps"]

curta:
  num_batches: 40
  num_structures_per_batch: 400

sqra:
  #capping_factor: 3000
  cutting_factor: 1e3
  #tolerance_rate_matrix_row_sum: 1e-10
  sigma: 0
  tolerance_eigendecomposition: 0

eigenvectors:
  num_interesting_timescales: 4
  num_interesting_eigenvectors: 12
  num_extremes_to_plot: "auto"